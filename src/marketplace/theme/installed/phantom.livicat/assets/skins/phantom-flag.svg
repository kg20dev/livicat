<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Phantom Name Flag — two-layer jagged shape.
    Outer outline (black) + inner fill (white).
    Derived from real theme.css clip-path: polygon(6% 67%, 95% 50%, 80% 0%, 2% 40%)
    Inset: 2px (approx 2% of 100px viewBox)
  -->
  <!-- Outer outline — black background -->
  <polygon points="6,67 95,50 80,0 2,40" fill="#0d0d0d"/>
  <!-- Inner fill — white, inset by ~2% -->
  <polygon points="8,65 93,50 78,3 4,41" fill="#ffffff"/>
</svg>
