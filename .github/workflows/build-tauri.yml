name: Build Tauri App

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true

env:
  RELEASE_BRANCH_PREFIX: 'release/'

permissions:
  contents: write

jobs:
  setup:
    name: Setup & Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check_release.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if should create release
        id: check_release
        run: |
          SHOULD_RELEASE="false"
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.create_release }}" == "true" ]] || [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            SHOULD_RELEASE="true"
          fi
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "Should create release: $SHOULD_RELEASE"

      - name: Validate version was bumped
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.version }}"
          LATEST_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION="${LATEST_TAG#v}"
          echo "Current version: $CURRENT_VERSION"
          echo "Latest release:  $LATEST_VERSION"
          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "❌ ERROR: Version $CURRENT_VERSION matches the latest release!"
            echo "Bump the version in package.json before merging to release/app."
            echo ""
            echo "To fix:"
            echo "  1. Update \"version\" in package.json"
            echo "  2. Run: node scripts/sync-version.cjs"
            echo "  3. Commit and push"
            exit 1
          fi
          echo "✅ Version $CURRENT_VERSION is new (latest release: $LATEST_VERSION)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Aptabase Analytics Key
        run: |
          echo "Checking Aptabase configuration..."
          if [ -z "${{ vars.APTABASE_APP_KEY }}" ]; then
            echo "❌ ERROR: APTABASE_APP_KEY environment variable not set!"
            echo "Analytics is required for production builds."
            echo ""
            echo "To fix this:"
            echo "1. Go to: https://github.com/kg20dev/livicat/settings/variables"
            echo "2. Click 'New repository variable'"
            echo "3. Name: APTABASE_APP_KEY"
            echo "4. Value: Your Aptabase App Key from https://us.aptabase.com"
            echo "5. Select Environment: release/** (or All)"
            echo "6. Save and retry"
            exit 1
          fi
          echo "✅ Aptabase key is configured"

  build-app:
    name: Build Frontend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: livicat-frontend
          path: dist/
          retention-days: 1

  build-mac:
    name: Build macOS App
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    needs: [setup, build-app]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-tauri CLI
        # Pin to 2.10 with --locked to avoid conflicting trait impl between
        # tauri-utils 2.9.2 and time >=0.3.48. Remove pin when tauri ships a fix.
        # Retry up to 3 times to handle transient network errors (e.g., fl/at registry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: cargo install tauri-cli --version "^2.10" --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        id: download-artifact
        continue-on-error: true
        with:
          name: livicat-frontend
          path: dist

      - name: Build frontend (fallback if artifact unavailable)
        if: steps.download-artifact.outcome == 'failure'
        run: npm run build

      - name: Build macOS app (Apple Silicon)
        run: |
          if [ -d "dist" ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            echo "✅ Using pre-built frontend artifacts"
          else
            echo "⚠️ No artifacts found, but frontend was built locally"
          fi
          cd src-tauri
          cargo tauri build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APTABASE_APP_KEY: ${{ vars.APTABASE_APP_KEY }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Ad-hoc sign and prepare macOS bundle
        run: |
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          APP_PATH="$DMG_DIR/Livicat.app"

          # Ad-hoc sign the .app bundle (in case Tauri's built-in signing didn't apply)
          if [ -d "$APP_PATH" ]; then
            echo "Ad-hoc signing .app bundle..."
            codesign --force --deep --sign - "$APP_PATH"
            codesign --verify --deep --strict "$APP_PATH" && echo "✅ Signature verified"
          else
            echo "⚠️ .app not found at $APP_PATH, trying alternative paths..."
            find src-tauri/target/release/bundle -name "*.app" -type d -exec codesign --force --deep --sign - {} \;
          fi

          # Strip quarantine flag from .dmg so it doesn't carry the attribute into the download
          for dmg in "$DMG_DIR"/*.dmg; do
            if [ -f "$dmg" ]; then
              xattr -rd com.apple.quarantine "$dmg" 2>/dev/null || true
              echo "✅ Quarantine stripped from $(basename "$dmg")"
            fi
          done

      - name: Upload macOS to R2
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="livicat-release"
          PREFIX="v${VERSION}"

          echo "☁️ Uploading macOS to R2: s3://${BUCKET}/${PREFIX}/"

          # Upload DMG (user download)
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] && aws s3 cp "$f" "s3://${BUCKET}/${PREFIX}/$(basename "$f")" --endpoint-url "$ENDPOINT" && echo "✅ $(basename "$f")"
          done

          # Upload updater artifacts (.app.tar.gz + .sig)
          for f in src-tauri/target/release/bundle/macos/*.app.tar.gz src-tauri/target/release/bundle/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && aws s3 cp "$f" "s3://${BUCKET}/${PREFIX}/$(basename "$f")" --endpoint-url "$ENDPOINT" && echo "✅ $(basename "$f")"
          done

          # Collect macOS updater info for latest.json generation
          mkdir -p /tmp/updater-info
          APP_TAR=$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -1)
          APP_SIG=$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz.sig 2>/dev/null | head -1)
          if [ -n "$APP_TAR" ] && [ -n "$APP_SIG" ]; then
            echo "url=https://pub-2a6e7087960e444c858cbb8adfebe109.r2.dev/${PREFIX}/$(basename "$APP_TAR")" > /tmp/updater-info/macos.env
            echo "signature=$(cat "$APP_SIG")" >> /tmp/updater-info/macos.env
            echo "✅ macOS updater info collected"
          fi

      - name: Upload macOS updater info
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: updater-macos
          path: /tmp/updater-info/macos.env
          retention-days: 1

  build-windows:
    name: Build Windows App
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: [setup, build-app]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-tauri CLI
        # Pin to 2.10 with --locked to avoid conflicting trait impl between
        # tauri-utils 2.9.2 and time >=0.3.48. Remove pin when tauri ships a fix.
        # Retry up to 3 times to handle transient network errors (e.g., fl/at registry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: cargo install tauri-cli --version "^2.10" --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Cache WiX binaries (Windows installer tool)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Temp\wix314-binaries
          key: wix314-${{ runner.os }}-v1

      - name: Install dependencies
        run: npm ci

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        id: download-artifact
        continue-on-error: true
        with:
          name: livicat-frontend
          path: dist

      - name: Build frontend (fallback if artifact unavailable)
        if: steps.download-artifact.outcome == 'failure'
        shell: bash
        run: npm run build

      - name: Clean Rust build cache (ensure fresh artifacts)
        shell: bash
        run: cd src-tauri && cargo clean

      - name: Build Windows app
        shell: bash
        run: |
          if [ -d "dist" ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            echo "✅ Using pre-built frontend artifacts"
          else
            echo "⚠️ No artifacts found, but frontend was built locally"
          fi
          cd src-tauri
          cargo tauri build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APTABASE_APP_KEY: ${{ vars.APTABASE_APP_KEY }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Upload Windows to R2
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="livicat-release"
          PREFIX="v${VERSION}"

          echo "☁️ Uploading Windows to R2: s3://${BUCKET}/${PREFIX}/"

          # Upload MSI/EXE (user download)
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            [ -f "$f" ] && aws s3 cp "$f" "s3://${BUCKET}/${PREFIX}/$(basename "$f")" --endpoint-url "$ENDPOINT" && echo "✅ $(basename "$f")"
          done
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] && aws s3 cp "$f" "s3://${BUCKET}/${PREFIX}/$(basename "$f")" --endpoint-url "$ENDPOINT" && echo "✅ $(basename "$f")"
          done

          # Upload updater artifacts (.msi.zip + .sig)
          for f in src-tauri/target/release/bundle/msi/*.msi.zip src-tauri/target/release/bundle/msi/*.msi.zip.sig; do
            [ -f "$f" ] && aws s3 cp "$f" "s3://${BUCKET}/${PREFIX}/$(basename "$f")" --endpoint-url "$ENDPOINT" && echo "✅ $(basename "$f")"
          done

          # Collect Windows updater info for latest.json generation
          mkdir -p /tmp/updater-info
          MSI_ZIP=$(ls src-tauri/target/release/bundle/msi/*.msi.zip 2>/dev/null | head -1)
          MSI_SIG=$(ls src-tauri/target/release/bundle/msi/*.msi.zip.sig 2>/dev/null | head -1)
          if [ -n "$MSI_ZIP" ] && [ -n "$MSI_SIG" ]; then
            echo "url=https://pub-2a6e7087960e444c858cbb8adfebe109.r2.dev/${PREFIX}/$(basename "$MSI_ZIP")" > /tmp/updater-info/windows.env
            echo "signature=$(cat "$MSI_SIG")" >> /tmp/updater-info/windows.env
            echo "✅ Windows updater info collected"
          fi

      - name: Upload Windows updater info
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: updater-windows
          path: /tmp/updater-info/windows.env
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [setup, build-mac, build-windows]
    if: needs.setup.outputs.should_release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS updater info
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: updater-macos
          path: /tmp/updater-info

      - name: Download Windows updater info
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: updater-windows
          path: /tmp/updater-info

      - name: Generate latest.json for updater
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="livicat-release"
          R2_BASE="https://pub-2a6e7087960e444c858cbb8adfebe109.r2.dev"

          # Build platforms JSON
          PLATFORMS="{}"

          if [ -f /tmp/updater-info/macos.env ]; then
            source /tmp/updater-info/macos.env
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$url" --arg sig "$signature" \
              '. + {"darwin-aarch64": {"url": $url, "signature": $sig}}')
            echo "✅ macOS updater info loaded"
          fi

          if [ -f /tmp/updater-info/windows.env ]; then
            source /tmp/updater-info/windows.env
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$url" --arg sig "$signature" \
              '. + {"windows-x86_64": {"url": $url, "signature": $sig}}')
            echo "✅ Windows updater info loaded"
          fi

          # Generate latest.json
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > /tmp/latest.json << EOF
          {
            "version": "v${VERSION}",
            "notes": "Livicat v${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": ${PLATFORMS}
          }
          EOF

          # Pretty-print
          jq '.' /tmp/latest.json > /tmp/latest-pretty.json
          mv /tmp/latest-pretty.json /tmp/latest.json

          echo "📋 latest.json:"
          cat /tmp/latest.json

          # Upload to R2 root
          aws s3 cp /tmp/latest.json "s3://${BUCKET}/latest.json" --endpoint-url "$ENDPOINT"
          echo "✅ latest.json uploaded to R2"

          # Verify upload by downloading and validating
          curl -sf "${R2_BASE}/latest.json" | jq -e '.version' > /dev/null
          if [ $? -eq 0 ]; then
            echo "✅ latest.json verified on R2"
            echo "Version: $(curl -sf "${R2_BASE}/latest.json" | jq -r '.version')"
            echo "Platforms: $(curl -sf "${R2_BASE}/latest.json" | jq -r '.platforms | keys | join(", ")')"
          else
            echo "❌ latest.json verification failed!"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          name: Livicat v${{ needs.setup.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎉 Livicat v${{ needs.setup.outputs.version }}

            ### Downloads

            All installers are available on [Cloudflare R2](https://pub-2a6e7087960e444c858cbb8adfebe109.r2.dev/v${{ needs.setup.outputs.version }}/):

            - **macOS (Apple Silicon)**: [Livicat_${{ needs.setup.outputs.version }}_aarch64.dmg](https://pub-2a6e7087960e444c858cbb8adfebe109.r2.dev/v${{ needs.setup.outputs.version }}/Livicat_${{ needs.setup.outputs.version }}_aarch64.dmg)
            - **Windows (x64)**: [Livicat_${{ needs.setup.outputs.version }}_x64-setup.exe](https://pub-2a6e7087960e444c858cbb8adfebe109.r2.dev/v${{ needs.setup.outputs.version }}/Livicat_${{ needs.setup.outputs.version }}_x64-setup.exe) or [Livicat_${{ needs.setup.outputs.version }}_x64.msi](https://pub-2a6e7087960e444c858cbb8adfebe109.r2.dev/v${{ needs.setup.outputs.version }}/Livicat_${{ needs.setup.outputs.version }}_x64.msi)

            ### What's New

            See the [commit history](https://github.com/kg20dev/livicat/commits/main) for details.

            ### Installation

            **macOS**:
            1. Download the appropriate `.dmg` file
            2. Open and drag Livicat to Applications
            3. Launch from Applications folder

            **Windows**:
            1. Download the `.exe` installer or `.msi` package
            2. Run the installer
            3. Launch Livicat from Start Menu

            ### 📚 Documentation

            For usage instructions, see the [README](https://github.com/kg20dev/livicat#readme)

            ---
            **Made with ❤️ for streamers**
