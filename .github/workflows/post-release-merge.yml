name: Post-Release Sync to Main

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Tauri App"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-to-main:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    name: Sync release/app → main
    runs-on: ubuntu-latest

    steps:
      - name: Determine source branch
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=release/app" >> $GITHUB_OUTPUT
          else
            TRIGGERING_ID="${{ github.event.workflow_run.id }}"
            BRANCH=$(gh api "repos/${{ github.repository }}/actions/runs/${TRIGGERING_ID}" --jq '.head_branch')
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "Triggering run branch: $BRANCH"
          fi

      - name: Checkout main
        if: steps.source.outputs.branch == 'release/app'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check if sync needed
        if: steps.source.outputs.branch == 'release/app'
        id: check
        run: |
          git fetch origin release/app
          DIFF=$(git rev-list main..origin/release/app --count)
          if [ "$DIFF" -eq 0 ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "✅ Already in sync"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "📦 $DIFF commit(s) to sync"
          fi

      - name: Create sync branch and push
        if: steps.source.outputs.branch == 'release/app' && steps.check.outputs.needed == 'true'
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="sync/release-to-main-$(date +%Y%m%d%H%M%S)"
          echo "Creating branch: $BRANCH"
          git checkout -b "$BRANCH"

          # Merge release/app — accept theirs for non-version files
          echo "Merging release/app..."
          git merge origin/release/app --no-edit -X theirs || true

          # Keep main's version files
          echo "Restoring main's version files..."
          git checkout main -- package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json 2>/dev/null || true
          git checkout main -- package-lock.json src-tauri/Cargo.lock 2>/dev/null || true
          git add -A

          # Commit if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync release/app to main"
            echo "Pushing $BRANCH..."
            git push origin "$BRANCH"
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to sync"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        if: steps.sync.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="${{ steps.sync.outputs.branch }}"
          echo "Creating PR from $BRANCH to main..."
          PR_URL=$(gh pr create \
            --title "chore: Sync release/app to main" \
            --body "Automated sync after release build." \
            --base main \
            --head "$BRANCH")
          echo "📋 PR: $PR_URL"
