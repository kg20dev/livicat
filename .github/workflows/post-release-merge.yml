name: Post-Release Sync to Main

on:
  workflow_run:
    workflows: ["Build Tauri App"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-to-main:
    if: github.event.workflow_run.conclusion == 'success'
    name: Sync release/app → main
    runs-on: ubuntu-latest

    steps:
      - name: Check triggering branch
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRIGGERING_ID="${{ github.event.workflow_run.id }}"
          BRANCH=$(gh api "repos/${{ github.repository }}/actions/runs/${TRIGGERING_ID}" --jq '.head_branch')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Triggering run branch: $BRANCH"

      - name: Checkout main
        if: steps.source.outputs.branch == 'release/app'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check if sync needed
        if: steps.source.outputs.branch == 'release/app'
        id: check
        run: |
          git fetch origin release/app
          DIFF=$(git rev-list main..origin/release/app --count)
          if [ "$DIFF" -eq 0 ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "✅ Already in sync"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "📦 $DIFF commit(s) to sync"
          fi

      - name: Create sync PR
        if: steps.source.outputs.branch == 'release/app' && steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/release-to-main-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git merge origin/release/app --no-edit -X theirs || true

          # The merge commit already contains all changes — just push and create PR
          if git diff main..HEAD --quiet; then
            echo "No changes to sync"
          else
            git push origin "$BRANCH"
            gh pr create \
              --title "chore: Sync release/app to main" \
              --body "Automated sync after release build." \
              --base main \
              --head "$BRANCH"
          fi
